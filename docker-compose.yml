services:
  pcp-sistema:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcp-analise-carga-maquina
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
